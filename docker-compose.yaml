version: '3.8'

services:
  db:
    image: postgres:15
    container_name: postgres-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrest
      POSTGRES_DB: finance
    ports:
      - "5432:5432"

  app:
    build: .
    container_name: finance-app
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://postgres:postgrest@db:5432/finance
    volumes:
      - ./keys:/app/keys